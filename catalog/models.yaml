# Model catalog: the source of truth for which models open-models keeps.
#
# Each entry pins one model to an exact Hugging Face commit and lists every file we keep,
# with size (bytes) and sha256, so any copy can be verified offline with `om verify`.
# Generate entries with `om pin` rather than by hand; validation rules live in
# src/open_models/catalog.py.
#
# Fields:
#   id        lowercase slug; also the folder name in each store (models/<id>/)
#   name      display name
#   repo      Hugging Face repo the files come from
#   revision  full 40-character commit hash (never a branch name)
#   format    gguf | safetensors | mlx
#   tier      hardware needed to run it; edge and utility models are also kept on the
#             working store (`om sync`), the rest are archive-only:
#               edge     CPU only, <= ~4 GB RAM (Raspberry Pi, 2012 MacBook Air)
#               utility  16 GB Apple Silicon laptop
#               mid      ~24-128 GB of fast memory
#               frontier ~256 GB+
#   role      chat | code | embedding
#   license   from the model card
#   pinned    date the entry was made (YYYY-MM-DD); `om list` warns after 180 days
#   files     list of {path, size, sha256}
#   notes     optional free text

